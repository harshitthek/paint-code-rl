# Apple Silicon MPS Provider Configuration (M4 / M3 / M2 with 16GB unified memory)
# Usable ML budget: ~13.18 GB after macOS system allocation

model:
  id: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  revision: "main"
  device_map: "auto"

training:
  batch_size: 2
  group_size: 2
  gradient_accumulation_steps: 1
  max_steps: 200
  checkpoint_freq: 25

generation:
  max_new_tokens: 320
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.12
  no_repeat_ngram_size: 6

reward:
  weights:
    compile: 0.10
    prompt_alignment: 0.35
    visual_richness: 0.25
    brush_utilization: 0.15
    aesthetic: 0.15

judge:
  provider: "local"
  model: "Qwen/Qwen2-VL-2B-Instruct"

safety:
  allow_external_apis: false

storage:
  base_path: "artifacts"
  datasets_path: "datasets"
