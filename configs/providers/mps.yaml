# Apple Silicon MPS Provider Configuration
# Overlays base.yaml when device is MPS (M4/M3/M2 with 16GB unified memory)
# Usable ML budget: ~13.18 GB after macOS overhead

model:
  id: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  revision: "main"
  device_map: "auto"

training:
  batch_size: 2       # Memory-safe for 16GB unified
  group_size: 2       # Minimum viable for GRPO advantage computation
  max_steps: 200
  checkpoint_freq: 50

generation:
  max_new_tokens: 256  # Reduce KV cache pressure on unified memory
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.12
  no_repeat_ngram_size: 6

judge:
  provider: "local"
  model: "Qwen/Qwen2-VL-2B-Instruct"

safety:
  allow_external_apis: false

storage:
  base_path: "artifacts"
  datasets_path: "datasets"
