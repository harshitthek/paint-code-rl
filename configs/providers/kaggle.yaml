# Kaggle GPU Provider Configuration (NVIDIA Tesla T4 x 2 or P100 16GB)
# Free zero-cost tier with CUDA SDPA hardware acceleration

model:
  id: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  revision: "main"
  device_map: "auto"

training:
  batch_size: 2        # 2 prompts per device
  group_size: 4        # 4 generations per prompt
  gradient_accumulation_steps: 2
  max_steps: 300
  checkpoint_freq: 50

generation:
  max_new_tokens: 450
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.12
  no_repeat_ngram_size: 6

reward:
  weights:
    compile: 0.10
    prompt_alignment: 0.35
    visual_richness: 0.25
    brush_utilization: 0.15
    aesthetic: 0.15

judge:
  provider: "local"
  model: "Qwen/Qwen2-VL-2B-Instruct"

safety:
  allow_external_apis: false

storage:
  base_path: "/kaggle/working/artifacts"
  datasets_path: "datasets"
