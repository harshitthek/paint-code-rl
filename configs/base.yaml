run:
  experiment_name: "phase0-baseline"
  seed: 42
  log_level: "INFO"
model:
  id: "Qwen/Qwen2.5-Coder-7B-Instruct"
  revision: "main"
  device_map: "auto"
training:
  batch_size: 16
  group_size: 4
  max_steps: 200
  checkpoint_freq: 50
generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.12
  no_repeat_ngram_size: 6
renderer:
  host: "127.0.0.1"
  port: 3000
  timeout_ms: 5000
  max_inflight_renders: 10
reward:
  weights:
    compile: 0.10
    prompt_alignment: 0.35
    visual_richness: 0.25
    brush_utilization: 0.15
    aesthetic: 0.15
judge:
  provider: "local"
  model: "Qwen/Qwen2-VL-2B-Instruct"
storage:
  type: "local"
  base_path: "artifacts"
  datasets_path: "datasets"
safety:
  allow_external_apis: false
aesthetic:
  provider: "clip"
  model: "openai/clip-vit-large-patch14"
  device: "auto"
