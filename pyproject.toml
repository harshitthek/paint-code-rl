[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paint_rl"
version = "0.1.0"
description = "Training AI to Paint with Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",
    "transformers==4.49.0",
    "trl==0.15.1",
    "peft>=0.14.0",
    "accelerate>=0.28.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "datasets>=2.14.0",
    "Pillow>=10.0.0",
    "safetensors>=0.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
