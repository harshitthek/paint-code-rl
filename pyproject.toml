[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paint_rl"
version = "0.1.0"
description = "Training AI to Paint with Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",
    "transformers==4.49.0",
    "trl==0.15.1",
    "peft",
    "bitsandbytes",
    "accelerate"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyyaml"
]
