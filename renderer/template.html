<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>p5.brush Renderer</title>
    <script>
        window.__FORCE_WEBGL = true;
        // SEED_INJECTION_HOOK
    </script>
    <!-- Vended locally -->
    <script src="assets/p5.min.js"></script>
    <script>
        // Must execute AFTER p5.js is loaded but BEFORE user code
        (function() {
            if (typeof p5 !== 'undefined') {
                const _orig = p5.prototype.createCanvas;
                p5.prototype.createCanvas = function(w, h, renderer) {
                    const webglConst = (typeof window !== 'undefined' && window.WEBGL) || (typeof p5 !== 'undefined' && p5.prototype && p5.prototype.WEBGL) || 'webgl';
                    const c = _orig.call(this, w || 600, h || 600, renderer || webglConst);
                    setTimeout(function() {
                        if (typeof window.signalRenderComplete === 'function') {
                            window.signalRenderComplete();
                        } else {
                            window.renderComplete = true;
                        }
                    }, 150);
                    return c;
                };
            }
        })();
    </script>
    <script src="assets/p5.brush.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #ffffff; }
        canvas { display: block; margin: auto; }
    </style>
</head>
<body>
    <script>
        // Explicit rendering contract
        window.renderComplete = false;
        Object.defineProperty(window, 'signalRenderComplete', {
            value: function() { window.renderComplete = true; },
            writable: false,
            configurable: false
        });
        window.addEventListener('error', function() {
            window.renderComplete = true;
        });
        window.addEventListener('unhandledrejection', function() {
            window.renderComplete = true;
        });

        // INJECT_CODE_HERE
    </script>
</body>
</html>
