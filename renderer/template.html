            if (typeof p5 !== 'undefined') {
                const _orig = p5.prototype.createCanvas;

            // Math and casing constants

                Two_PI: Math.PI * 2,
                TwoPi: Math.PI * 2,
                two_pi: Math.PI * 2,

                QUARTER_PI: Math.PI / 4,
                TAU: Math.PI * 2,
                Tau: Math.PI * 2,
                tau: Math.PI * 2,
                PI: Math.PI,
                Pi: Math.PI,
                pi: Math.PI,
            };
            for (const [k, v] of Object.entries(mathConsts)) {
                window[k] = v;
                if (typeof p5 !== 'undefined' && p5.prototype) {

                }

            // Numerical constants so unquoted words never throw ReferenceError
            const numConsts = {
                ZERO: 0, Zero: 0, zero: 0,
                ONE: 1, One: 1, one: 1,
                TWO: 2, Two: 2, two: 2,
                THREE: 3, Three: 3, three: 3,

            for (const [k, v] of Object.entries(numConsts)) {

            // Lighting stubs
            ['ambientLight', 'pointLight', 'directionalLight', 'spotLight', 'lights', 'noLights'].forEach(fn => {

            const _dummyLerpColor = function(c1, c2, amt) {
                try {
                    if (typeof window.lerpColor === 'function') return window.lerpColor(c1, c2, amt);

            window.LerpColor = _dummyLerpColor;
            window.lerp_color = _dummyLerpColor;
            window.Lerp = typeof window.lerp === 'function' ? window.lerp : function(a, b, t) { return a + (b - a) * t; };
            if (typeof p5 !== 'undefined' && p5.prototype) {
                p5.prototype.lERPColor = p5.prototype.lerpColor;
                p5.prototype.LerpColor = p5.prototype.lerpColor;
                p5.prototype.lerp_color = p5.prototype.lerpColor;
                p5.prototype.Lerp = p5.prototype.lerp;

            // Robust color parser
            if (typeof p5 !== 'undefined' && p5.prototype && p5.prototype.color) {

                    }
                    try {
                        return _origP5Color.apply(this, args);
                    } catch(e) {
                        return _origP5Color.call(this, '#1a759f');
                    }
                };
            }

            // Camera omni proxy
            function makeOmniProxy(fn) {
                const handler = {
                    get(target, prop) {
                        if (prop in target) {
                            const v = target[prop];
                            return typeof v === 'function' ? v.bind(target) : v;
                        }
                        return makeOmniProxy(function() {});
                    },
                    apply(target, thisArg, args) {
                        try {
                            if (typeof target === 'function') return target.apply(thisArg, args);
                        } catch(e) {}
                        return makeOmniProxy(function() {});
                    }
                };
                return new Proxy(fn || function() {}, handler);
            }

            let _activeCamera = makeOmniProxy(window.camera || function() {});
            try {
                Object.defineProperty(window, 'camera', {
                    get() { return _activeCamera; },
                    set(val) { _activeCamera = makeOmniProxy(val); },

            if (typeof p5 !== 'undefined' && p5.prototype && p5.prototype.camera) {
                p5.prototype.camera.position = function() {};
                p5.prototype.camera.lookAt = function() {};
            }
        })();

<body>
    <script>
        // Explicit rendering contract
        window.renderComplete = false;
        Object.defineProperty(window, 'signalRenderComplete', {
            value: function() { window.renderComplete = true; },
            writable: false,
            configurable: false

        function ensureFallbackCanvas() {
            try {
                if (!document.querySelector('canvas')) {
                    const c = document.createElement('canvas');
                    c.width = 600;
                    c.height = 600;
                    document.body.appendChild(c);
                }
            } catch(e) {}
        }
        window.addEventListener('error', function() {
            ensureFallbackCanvas();
            window.renderComplete = true;
        });
        window.addEventListener('unhandledrejection', function() {
            ensureFallbackCanvas();
            window.renderComplete = true;
        });
