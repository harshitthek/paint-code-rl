<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>p5.brush Renderer</title>
    <!-- Vended locally -->
    <script src="assets/p5.min.js"></script>
    <script src="assets/p5.brush.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #ffffff; }
        canvas { display: block; margin: auto; }
    </style>
</head>
<body>
    <script>
        // Explicit rendering contract
        window.renderComplete = false;
        window.signalRenderComplete = function() {
            window.renderComplete = true;
        };

        // WebGL Guard: Automatically ensure createCanvas creates a WEBGL canvas for p5.brush
        window.addEventListener('load', function() {
            if (typeof p5 !== 'undefined') {
                const originalCreateCanvas = p5.prototype.createCanvas;
                p5.prototype.createCanvas = function(w, h, renderer) {
                    // Force WEBGL renderer for p5.brush compatibility
                    return originalCreateCanvas.call(this, w || 600, h || 600, typeof WEBGL !== 'undefined' ? WEBGL : renderer);
                };
            }
        });

        // INJECT_CODE_HERE
    </script>
</body>
</html>
